<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Mon budget</title>
<style>
  :root{
    --bg: #FBF7F0;
    --paper: #FFFFFF;
    --border: #E9DFD0;
    --text: #2E2A26;
    --text-soft: #746A5D;
    --accent: #B5541A;
    --accent-dark: #8E4014;
    --accent-soft: #F3E3D6;
    --green: #3F7D4F;
    --green-soft: #E4F0E6;
    --red: #B23A3A;
    --red-soft: #FBE9E7;
    --blue: #2B6777;
    --blue-soft: #E4EEF0;
    --shadow: 0 2px 10px rgba(60,45,25,0.08);
    --radius: 16px;
    --radius-sm: 10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
    font-size:17px;
    line-height:1.4;
    -webkit-font-smoothing:antialiased;
    padding-bottom:60px;
  }
  h1,h2,h3{margin:0 0 6px 0; font-weight:700;}
  button{
    font-family:inherit;
    font-size:16px;
    cursor:pointer;
    border:none;
    border-radius:12px;
    padding:12px 18px;
    background:var(--accent);
    color:white;
    font-weight:600;
    transition: background .15s, transform .05s;
  }
  button:active{transform:scale(0.97);}
  button.secondary{
    background:var(--paper);
    color:var(--text);
    border:2px solid var(--border);
  }
  button.ghost{
    background:transparent;
    color:var(--accent-dark);
    border:2px solid var(--accent-soft);
    padding:8px 14px;
  }
  button.btn-highlight{
    background:var(--accent);
    color:white;
    border:2px solid var(--accent);
    font-weight:700;
  }
  button.btn-highlight:hover{ background:var(--accent-dark); }
  .icon-btn:disabled{ opacity:.25; cursor:default; }
  .icon-btn:disabled:hover{ background:transparent; }
  button.danger{ background:var(--red); }
  button.small{ padding:8px 12px; font-size:14px; border-radius:9px; }
  button:disabled{opacity:.5; cursor:default;}
  input, select{
    font-family:inherit;
    font-size:16px;
    padding:10px 12px;
    border:2px solid var(--border);
    border-radius:10px;
    background:var(--paper);
    color:var(--text);
    width:100%;
  }
  input:focus, select:focus{ outline:2px solid var(--accent); border-color:var(--accent); }
  label{ font-size:14px; color:var(--text-soft); font-weight:600; display:block; margin-bottom:4px; }
  .field{ margin-bottom:14px; }

  /* ===== Layout ===== */
  #topbar{
    background:var(--paper);
    border-bottom:1px solid var(--border);
    padding:16px 20px;
    position:sticky; top:0; z-index:30;
    box-shadow:var(--shadow);
  }
  #topbar-row1{
    display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
  }
  #app-title{ font-size:22px; color:var(--accent-dark); }
  #month-nav{
    display:flex; align-items:center; gap:10px; background:var(--accent-soft);
    padding:6px 8px; border-radius:14px;
  }
  #month-nav button.navarrow{
    background:var(--paper); color:var(--accent-dark); width:40px; height:40px;
    border-radius:10px; padding:0; font-size:20px; display:flex; align-items:center; justify-content:center;
    border:2px solid var(--border);
  }
  #month-label{ font-weight:700; font-size:18px; min-width:150px; text-align:center; }

  #top-icons{
    display:flex; align-items:center; gap:6px;
  }
  .icon-link-btn{
    background:transparent; color:var(--text-soft); border:none; padding:8px 10px;
    font-size:15px; font-weight:600; border-radius:10px;
  }
  .icon-link-btn:hover{ background:var(--bg); color:var(--accent-dark); }
  .icon-link-label{ font-size:14px; }
  @media (max-width:600px){ .icon-link-label{ display:none; } }

  /* Onglets de mois, façon classeur Excel */
  #month-tabs{
    display:flex; gap:6px; margin-top:12px; overflow-x:auto; padding-bottom:4px;
  }
  .month-tab-btn{
    background:var(--bg); color:var(--text-soft); border:2px solid var(--border); border-bottom:none;
    padding:9px 16px; border-radius:10px 10px 0 0; font-weight:600; white-space:nowrap; flex-shrink:0;
  }
  .month-tab-btn.active{ background:var(--accent-soft); color:var(--accent-dark); border-color:var(--accent); }
  .month-tab-add{
    background:transparent; color:var(--accent-dark); border:2px dashed var(--accent-soft);
    padding:9px 14px; border-radius:10px 10px 0 0; font-weight:700; white-space:nowrap; flex-shrink:0;
  }
  .archived-banner{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--blue-soft); color:var(--blue); border-radius:12px; padding:12px 16px; margin-bottom:16px; font-weight:600;
  }
  .archive-card{
    border:2px solid var(--border); border-radius:var(--radius-sm); padding:16px; margin-bottom:12px;
    display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
  }

  #layout{
    max-width:1200px; margin:0 auto; padding:20px;
    display:grid; grid-template-columns: 1fr 320px; gap:20px;
    align-items:start;
  }
  #main, #sidebar{ min-width:0; }
  @media (max-width: 880px){
    #layout{ grid-template-columns: 1fr; }
    #sidebar{ order:-1; }
  }

  .card{
    background:var(--paper); border:1px solid var(--border); border-radius:var(--radius);
    padding:18px 20px; box-shadow:var(--shadow); margin-bottom:18px;
  }
  .card-head{
    display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; gap:8px; flex-wrap:wrap;
  }
  .card-head h2{ font-size:19px; color:var(--accent-dark); }
  .pill{
    display:inline-block; font-size:13px; font-weight:700; padding:3px 10px; border-radius:999px;
  }
  .pill.fixe{ background:var(--blue-soft); color:var(--blue); }
  .pill.variable{ background:var(--green-soft); color:var(--green); }

  table{ width:100%; border-collapse:collapse; table-layout:auto; }
  table.line-table th{ text-align:right; font-size:12px; color:var(--text-soft); padding:4px 8px; border-bottom:2px solid var(--border); font-weight:700; }
  table.line-table th:first-child{ text-align:left; }
  table.line-table td:first-child{ white-space:nowrap; }
  table.line-table{ min-width:max-content; }
  table.line-table td.amt-col, table.line-table th.amt-col{ text-align:right; white-space:nowrap; }
  .table-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; min-width:0; }
  #layout, .card, .modal-box{ max-width:100%; }
  .card{ min-width:0; }
  body{ overflow-x:hidden; }
  th{ text-align:left; font-size:13px; color:var(--text-soft); padding:6px 4px; border-bottom:2px solid var(--border); }
  td{ padding:9px 8px; border-bottom:1px solid var(--border); vertical-align:middle; }
  tr.subtotal-row td{ font-weight:700; background:var(--bg); }
  tr.line-checked{ opacity:0.42; transition:opacity .15s; }
  .row-check{ width:26px; text-align:center; }
  .row-check input[type=checkbox]{ width:20px; height:20px; cursor:pointer; }
  .row-move{ width:44px; white-space:nowrap; padding-right:2px !important; }
  .row-move .icon-btn{ padding:4px; font-size:13px; }
  .row-actions{ display:flex; gap:6px; justify-content:flex-end; white-space:nowrap; }
  .icon-btn{
    background:transparent; border:none; color:var(--text-soft); padding:6px; border-radius:8px; font-size:17px;
  }
  .icon-btn:hover{ background:var(--bg); }
  .amount{ font-variant-numeric: tabular-nums; font-weight:600; white-space:nowrap; }
  .amount.neg{ color:var(--red); }
  .amount.pos{ color:var(--green); }
  .muted{ color:var(--text-soft); font-size:14px; }

  .total-line{
    display:flex; justify-content:space-between; align-items:baseline; padding-top:10px; margin-top:6px;
    border-top:2px solid var(--border); font-size:19px; font-weight:700;
  }

  /* Sidebar solde */
  #sidebar .card{ position:sticky; top:180px; }
  #solde-card{ background:linear-gradient(160deg, var(--accent-soft), var(--paper)); border-color:var(--accent-soft); }
  #solde-value{ font-size:34px; font-weight:800; color:var(--accent-dark); margin:6px 0; }
  #solde-reste{ font-size:26px; font-weight:800; margin:6px 0; }
  .solde-breakdown{ margin-top:10px; font-size:14px; }
  .solde-breakdown div{ display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px dashed var(--border); }

  .empty-hint{ color:var(--text-soft); font-style:italic; padding:10px 0; }

  /* Apercu 3 mois */
  #apercu-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(220px,1fr)); gap:14px; }
  .apercu-month{
    border:2px solid var(--border); border-radius:var(--radius-sm); padding:16px; text-align:center;
  }
  .apercu-month.current{ border-color:var(--accent); background:var(--accent-soft); }
  .apercu-month h3{ font-size:17px; margin-bottom:10px; }
  .apercu-row{ display:flex; justify-content:space-between; font-size:15px; padding:3px 0; }
  .apercu-solde{ font-size:22px; font-weight:800; margin-top:8px; }

  /* Modal */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(30,20,10,0.4); display:flex; align-items:center; justify-content:center;
    z-index:100; padding:16px;
  }
  .modal-box{
    background:var(--paper); border-radius:var(--radius); padding:24px; max-width:440px; width:100%;
    max-height:88vh; overflow-y:auto; box-shadow:0 10px 40px rgba(0,0,0,0.25);
    position:relative;
  }
  .modal-x-close{
    position:absolute; top:14px; right:14px; background:var(--bg); color:var(--text-soft);
    border:none; border-radius:50%; width:34px; height:34px; font-size:16px; font-weight:700;
    display:flex; align-items:center; justify-content:center; padding:0;
  }
  .modal-x-close:hover{ background:var(--accent-soft); color:var(--accent-dark); }
  .modal-box-large{
    max-width:98vw; width:1400px; max-height:96vh;
  }
  .modal-box h3{ font-size:20px; margin-bottom:14px; color:var(--accent-dark); }
  .modal-foot{ display:flex; justify-content:flex-end; gap:10px; margin-top:18px; }
  .radio-group{ display:flex; gap:10px; }
  .radio-opt{
    flex:1; border:2px solid var(--border); border-radius:10px; padding:10px; text-align:center; cursor:pointer; font-weight:600;
  }
  .radio-opt.selected.fixe{ border-color:var(--blue); background:var(--blue-soft); color:var(--blue); }
  .radio-opt.selected.variable{ border-color:var(--green); background:var(--green-soft); color:var(--green); }

  #toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--text); color:white; padding:12px 20px; border-radius:12px; font-weight:600;
    box-shadow:0 4px 20px rgba(0,0,0,0.3); z-index:200; opacity:0; pointer-events:none; transition:opacity .25s;
  }
  #toast.show{ opacity:1; }

  .cat-block{ margin-bottom:22px; }
  .cat-block:last-child{ margin-bottom:0; }
  .cat-block-title{ display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .cat-block-title h3{ font-size:16px; }

  .add-line-btn{ margin-top:8px; }

  .expense-tag{ font-size:12px; color:var(--text-soft); }

  select.type-select{ width:auto; }

  .settings-list-item{
    display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border);
  }

  #print-area{ display:none; }

  @media print{
    @page{ size:A4 landscape; margin:9mm; }
    body > *:not(#print-area){ display:none !important; }
    #print-area{ display:block !important; position:static; width:100%; padding:0; font-size:11.5px; }
    #print-area h1{ font-size:19px; margin:0 0 8px 0; }
    #print-area h2{ font-size:12.5px; margin:0 0 3px 0; text-transform:uppercase; letter-spacing:.02em; }
    #print-area table{ width:100%; border-collapse:collapse; margin-bottom:9px;}
    #print-area td, #print-area th{ border:1px solid #bbb; padding:2.5px 6px; font-size:11px; line-height:1.25; }
    #print-area td.pchk{ width:14px; text-align:center; padding:2.5px 3px; }
    #print-area td.pamt, #print-area th.pamt{ text-align:right; white-space:nowrap; width:70px; }
    #print-area tr.ptotal th{ background:#eee; }
    #print-area .print-columns{ column-count:4; column-gap:12px; }
    #print-area .print-col{ break-inside:avoid; margin-bottom:6px; }
  }

  a.link-btn{ color:var(--accent-dark); font-weight:700; text-decoration:none; cursor:pointer; }

  textarea{
    font-family: monospace; font-size:13px; width:100%; padding:10px; border-radius:10px; border:2px solid var(--border);
  }
</style>
</head>
<body>

<div id="topbar">
  <div id="topbar-row1">
    <h1 id="app-title">💶 Mon budget</h1>
    <div id="top-icons">
      <button class="icon-link-btn" id="btn-open-archives" title="Archives">🗄️ <span class="icon-link-label">Archives</span></button>
      <button class="icon-link-btn" id="btn-open-settings" title="Réglages">⚙️</button>
    </div>
  </div>
  <div id="month-tabs"></div>
</div>

<div id="layout">
  <div id="main"></div>
  <div id="sidebar"></div>
</div>

<div id="print-area"></div>
<div id="toast"></div>

","nom":"mobile MF","prevu":10,"type":"fixe"},{"id":"ch-2026-12-cat-remboursements-cic-0","categoryId":"cat-remboursements-cic","nom":"Assurances C3 CIC","prevu":56,"type":"fixe"},{"id":"ch-2026-12-cat-remboursements-cic-1","categoryId":"cat-remboursements-cic","nom":"Assurance maison CIC","prevu":51,"type":"fixe"},{"id":"ch-2026-12-cat-impots-0","categoryId":"cat-impots","nom":"Impots","prevu":120,"type":"fixe"},{"id":"ch-2026-12-cat-impots-1","categoryId":"cat-impots","nom":"Impôts fonciers","prevu":127,"type":"fixe"},{"id":"ch-2026-12-cat-impots-2","categoryId":"cat-impots","nom":"Impots Foncier Marion","prevu":97,"type":"fixe"},{"id":"ch-2026-12-cat-impots-3","categoryId":"cat-impots","nom":"Véronique pret","prevu":200,"type":"fixe"},{"id":"ch-2026-12-cat-impots-4","categoryId":"cat-impots","nom":"Frère Paul","prevu":5.99,"type":"fixe"},{"id":"ch-2026-12-cat-depenses-diverses-0","categoryId":"cat-depenses-diverses","nom":"Bernard","prevu":50,"type":"fixe"},{"id":"ch-2026-12-cat-depenses-diverses-1","categoryId":"cat-depenses-diverses","nom":"Livret A MF+B","prevu":100,"type":"fixe"},{"id":"ch-2026-12-cat-depenses-diverses-2","categoryId":"cat-abonnements","nom":"Verisure","prevu":60,"type":"fixe"},{"id":"ch-mt4l82tq-r0sh8","categoryId":"cat-alimentation","nom":"Carburant","prevu":120,"type":"variable"},{"id":"ch-mt4l8xul-zqo1j","categoryId":"cat-alimentation","nom":"Achats internet","prevu":300,"type":"variable"},{"id":"ch-mt4migzn-azcpn","categoryId":"cat-alimentation","nom":"Eglise","prevu":0,"type":"variable"},{"id":"ch-mt4m4mek-33paz","categoryId":"cat-alimentation","nom":"Dépenses exceptionnelles","prevu":0,"type":"variable"}],"expenses":[]}},"currentMonthId":"2026-08","soldeBancaire":{"montant":931,"date":"2026-08-22"},"updatedAt":1787419932857,"veronique":{"entries":[]}};

<script>
/* ============================================================
   BUDGET DE MAMIE — application locale (usage sur un seul appareil)
   ============================================================ */

var STORAGE_KEY = 'budgetMamieState_v1';
var MOIS_NOMS = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];

var state = null;
var currentTab = 'mois';
var viewingArchivedFrom = null; // mémorise qu'on est arrivé sur ce mois depuis les Archives

/* ---------------- Utilitaires ---------------- */
function uid(prefix){ return prefix + '-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,7); }
function fmtEUR(n){
  n = Number(n) || 0;
  return n.toLocaleString('fr-FR', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' €';
}
function fmtDate(iso){
  if(!iso) return '';
  var d = new Date(iso);
  if(isNaN(d)) return iso;
  return d.toLocaleDateString('fr-FR', {day:'2-digit', month:'2-digit', year:'numeric'});
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function showToast(msg, isError){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = isError ? '#B23A3A' : '#2E2A26';
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(function(){ t.classList.remove('show'); }, 2800);
}
function monthLabel(monthId){
  var parts = monthId.split('-');
  var y = parts[0], m = parseInt(parts[1],10);
  return MOIS_NOMS[m-1] + ' ' + y;
}
function nextMonthId(monthId){
  var parts = monthId.split('-');
  var y = parseInt(parts[0],10), m = parseInt(parts[1],10);
  m += 1;
  if(m > 12){ m = 1; y += 1; }
  return y + '-' + String(m).padStart(2,'0');
}
function prevMonthId(monthId){
  var parts = monthId.split('-');
  var y = parseInt(parts[0],10), m = parseInt(parts[1],10);
  m -= 1;
  if(m < 1){ m = 12; y -= 1; }
  return y + '-' + String(m).padStart(2,'0');
}
function sortedMonthIds(){
  return Object.keys(state.months).sort();
}
function realCurrentMonthId(){
  return todayISO().slice(0,7);
}
function isArchived(monthId){
  return monthId < realCurrentMonthId();
}
function activeMonthIds(){
  return sortedMonthIds().filter(function(id){ return !isArchived(id); });
}
function archivedMonthIds(){
  return sortedMonthIds().filter(function(id){ return isArchived(id); });
}

/* ---------------- État : chargement / sauvegarde ---------------- */
var SEED_VERSION = (window.SEED_DATA && window.SEED_DATA.updatedAt) || 0;

function defaultState(){
  var seed = JSON.parse(JSON.stringify(window.SEED_DATA));
  if(!seed.veronique) seed.veronique = { entries: [] };
  if(!seed.meta) seed.meta = {};
  if(!seed.soldeBancaire) seed.soldeBancaire = { montant: null, date: null };
  var monthIds = Object.keys(seed.months).sort();
  if(!seed.currentMonthId || !seed.months[seed.currentMonthId]){
    seed.currentMonthId = monthIds[0] || todayISO().slice(0,7);
  }
  seed._seedVersion = SEED_VERSION;
  seed.updatedAt = Date.now();
  return seed;
}

function loadState(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      state = JSON.parse(raw);
      if(!state.categories) state = defaultState();
      // Si le fichier a été mis à jour avec de nouvelles données (nouvel export/nouvelle version),
      // on repart des données fraîches plutôt que de garder l'ancienne sauvegarde du navigateur.
      else if((state._seedVersion || 0) < SEED_VERSION){
        state = defaultState();
      }
    } else {
      state = defaultState();
    }
  }catch(e){
    state = defaultState();
  }
  if(!state.months[state.currentMonthId]){
    var ids = sortedMonthIds();
    state.currentMonthId = ids.length ? ids[0] : todayISO().slice(0,7);
  }
  if(!state.veronique) state.veronique = { entries: [] };
  if(!state.meta) state.meta = {};
  // Au premier chargement, on affiche de préférence le mois réel en cours (ou le premier mois actif)
  if(isArchived(state.currentMonthId)){
    var act = activeMonthIds();
    if(act.length) state.currentMonthId = act[0];
  }
}

function saveState(){
  state.updatedAt = Date.now();
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(e){
    console.error('Sauvegarde locale impossible', e);
  }
}

/* ---------------- Calculs ---------------- */
function getMonth(monthId){ return state.months[monthId]; }

function chargeReel(month, chargeId){
  var sum = 0;
  month.expenses.forEach(function(e){ if(e.chargeId === chargeId) sum += Number(e.montant)||0; });
  return sum;
}

function monthTotals(monthId){
  var month = getMonth(monthId);
  if(!month) return null;
  var totalRecettes = month.recettes.reduce(function(s,r){ return s + (Number(r.montant)||0); }, 0);
  var byCat = {};
  state.categories.forEach(function(c){ byCat[c.id] = { categorie:c, items:[], sousTotal:0 }; });
  var totalCharges = 0;
  month.charges.forEach(function(ch){
    var bucket = byCat[ch.categoryId];
    if(!bucket) return;
    var prevu = Number(ch.prevu)||0;
    var reel = ch.type === 'variable' ? chargeReel(month, ch.id) : prevu;
    var reste = ch.type === 'variable' ? (prevu - reel) : 0;
    bucket.items.push({ charge: ch, prevu: prevu, reel: reel, reste: reste });
    bucket.sousTotal += prevu;
    totalCharges += prevu;
  });
  var solde = totalRecettes - totalCharges;

  // Montant des enveloppes variables non encore dépensées (reste à venir ce mois-ci)
  var resteVariableAVenir = 0;
  var totalVariableDepense = 0;
  month.charges.forEach(function(ch){
    if(ch.type === 'variable'){
      var prevu = Number(ch.prevu)||0;
      var reel = chargeReel(month, ch.id);
      var reste = prevu - reel;
      if(reste > 0) resteVariableAVenir += reste;
      totalVariableDepense += reel;
    }
  });

  return { totalRecettes: totalRecettes, totalCharges: totalCharges, solde: solde, byCat: byCat, resteVariableAVenir: resteVariableAVenir, totalVariableDepense: totalVariableDepense };
}

function allVariableCharges(monthId){
  var month = getMonth(monthId);
  var list = [];
  month.charges.forEach(function(ch){
    if(ch.type === 'variable'){
      var cat = state.categories.find(function(c){ return c.id === ch.categoryId; });
      list.push({ charge: ch, categorie: cat ? cat.nom : '', reel: chargeReel(month, ch.id) });
    }
  });
  return list;
}

/* ---------------- Rendu général ---------------- */
function render(){
  renderTopbar();
  renderSidebar();
  var main = document.getElementById('main');
  main.innerHTML = '';
  renderTabBudget(main);
}

function renderTopbar(){
  var monthTabsEl = document.getElementById('month-tabs');
  var ids = activeMonthIds();
  // Si le mois affiché est archivé (consulté depuis les Archives), on l'ajoute temporairement à la liste visible
  if(isArchived(state.currentMonthId) && ids.indexOf(state.currentMonthId) === -1){
    ids = [state.currentMonthId].concat(ids);
  }
  var html = '';
  ids.forEach(function(mid){
    var m = state.months[mid];
    html += '<button class="month-tab-btn '+(mid===state.currentMonthId?'active':'')+'" data-month="'+mid+'">'+escapeHtml(m.label)+'</button>';
  });
  html += '<button class="month-tab-add" id="btn-new-month-tab">+ Nouveau mois</button>';
  monthTabsEl.innerHTML = html;
  monthTabsEl.style.display = 'flex';
  monthTabsEl.querySelectorAll('.month-tab-btn').forEach(function(b){
    b.onclick = function(){ state.currentMonthId = this.getAttribute('data-month'); saveState(); render(); };
  });
  document.getElementById('btn-new-month-tab').onclick = function(){
    var ids2 = sortedMonthIds();
    var nid = nextMonthId(ids2[ids2.length-1]);
    openConfirm('Créer '+monthLabel(nid)+' ?', 'Les recettes et les charges du dernier mois seront reprises à l\'identique. Tu pourras ensuite les ajuster.', function(){
      createNewMonth();
      render();
    });
  };

  document.getElementById('btn-open-archives').onclick = openArchivesModal;
  document.getElementById('btn-open-settings').onclick = openSettingsModal;
}

/* ---------------- Sidebar : solde bancaire ---------------- */
function computeSoldeProjection(monthId){
  var month = getMonth(monthId);
  var uncheckedDetailExpenses = 0;
  month.expenses.forEach(function(e){ if(!e.paid) uncheckedDetailExpenses += Number(e.montant)||0; });
  var uncheckedFixedCharges = 0;
  var resteVariablePrevisionnel = 0;
  month.charges.forEach(function(ch){
    if(ch.type === 'fixe'){
      if(!ch.paid) uncheckedFixedCharges += Number(ch.prevu)||0;
    } else {
      var reel = chargeReel(month, ch.id);
      var reste = (Number(ch.prevu)||0) - reel;
      resteVariablePrevisionnel += reste;
    }
  });
  var totalADeduire = uncheckedDetailExpenses + uncheckedFixedCharges + resteVariablePrevisionnel;
  return {
    uncheckedDetailExpenses: uncheckedDetailExpenses,
    uncheckedFixedCharges: uncheckedFixedCharges,
    resteVariablePrevisionnel: resteVariablePrevisionnel,
    totalADeduire: totalADeduire
  };
}

function veroniqueBalance(){
  var solde = 0;
  (state.veronique.entries || []).forEach(function(e){
    if(e.settled) return;
    solde += (e.direction === 'doit_a_mamie') ? Number(e.montant)||0 : -(Number(e.montant)||0);
  });
  return solde;
}

function renderSidebar(){
  var sb = document.getElementById('sidebar');
  var monthId = state.currentMonthId;
  var proj = computeSoldeProjection(monthId);
  var montant = state.soldeBancaire.montant;
  var reste = (montant !== null && montant !== undefined) ? (montant - proj.totalADeduire) : null;

  var html = '';
  html += '<div class="card" id="solde-card">';
  html += '<div class="card-head"><h2>💰 Solde bancaire</h2></div>';

  }

  if(reste !== null){
    html += '<div style="margin-top:16px;">';

    html += '</div>';

  sb.innerHTML = html;

function escapeHtml(s){
  if(s === undefined || s === null) return '';
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

/* ---------------- Modale : Dépenses variables (mois sélectionné) ---------------- */
function openVariableExpensesModal(monthId, categoryId){
  var month = getMonth(monthId);
  var chargeIdsInCat = categoryId ? month.charges.filter(function(c){ return c.categoryId === categoryId; }).map(function(c){ return c.id; }) : null;
  var list = month.expenses.slice()
    .filter(function(e){ return !chargeIdsInCat || chargeIdsInCat.indexOf(e.chargeId) !== -1; })
    .sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); });
  var total = list.reduce(function(s,e){ return s + (Number(e.montant)||0); }, 0);
  var cat = categoryId ? state.categories.find(function(c){ return c.id === categoryId; }) : null;

  var inner = '<button class="modal-x-close" id="varexp-close-x" title="Fermer">✕</button>';
  inner += '<h3>📋 '+escapeHtml(cat?cat.nom:'Dépenses variables')+' · '+escapeHtml(month.label)+'</h3>';

  inner += '<button class="btn-highlight small" id="btn-quick-add-expense">+ Ajouter une dépense</button>';
  inner += '<button class="ghost small" id="btn-print-varexp">🖨️ Imprimer</button>';
  inner += '</div>';
  if(list.length === 0){
    inner += '<div class="empty-hint">Aucune dépense enregistrée ce mois-ci.</div>';
  } else {
    inner += '<div class="table-scroll"><table class="line-table"><thead><tr><th>Date</th><th>Charge</th><th>Libellé</th><th class="amt-col">Montant</th><th class="row-check"></th><th></th></tr></thead><tbody>';
    list.forEach(function(e){
      var charge = month.charges.find(function(c){ return c.id === e.chargeId; });
      inner += '<tr class="'+(e.paid?'line-checked':'')+'">';
      inner += '<td>'+fmtDate(e.date)+'</td>';
      inner += '<td>'+escapeHtml(charge?charge.nom:'(supprimée)')+'</td>';
      inner += '<td>'+escapeHtml(e.label||'')+'</td>';
      inner += '<td class="amt-col amount">'+fmtEUR(e.montant)+'</td>';
      inner += '<td class="row-check"><input type="checkbox" class="chk-expense-modal" data-id="'+e.id+'" '+(e.paid?'checked':'')+'></td>';
      inner += '<td class="row-actions"><button class="icon-btn btn-edit-expense-modal" data-id="'+e.id+'">✏️</button></td>';
      inner += '</tr>';
    });
    inner += '</tbody></table></div>';
    inner += '<div class="total-line"><span>Total</span><span class="amount">'+fmtEUR(total)+'</span></div>';
  }
  inner += '<div class="modal-foot"><button class="secondary" id="varexp-close">Fermer</button></div>';
  openModalShell(inner, true);
  document.getElementById('varexp-close').onclick = closeModal;
  document.getElementById('varexp-close-x').onclick = closeModal;
  document.getElementById('btn-quick-add-expense').onclick = function(){
    openQuickExpenseModal(monthId, categoryId);
  };
  document.getElementById('btn-print-varexp').onclick = function(){
    printVariableExpenses(monthId, categoryId);
  };
  document.querySelectorAll('#modal-overlay .chk-expense-modal').forEach(function(cb){
    cb.onchange = function(){
      var id = this.getAttribute('data-id');
      var checked = this.checked;
      var e = month.expenses.find(function(x){ return x.id === id; });
      if(e){ e.paid = checked; saveState(); render(); }
      var tr = this.closest('tr');
      if(tr) tr.classList.toggle('line-checked', checked);
    };
  });
  document.querySelectorAll('#modal-overlay .btn-edit-expense-modal').forEach(function(b){
    b.onclick = function(){
      openEditExpenseModal(monthId, this.getAttribute('data-id'), categoryId);
    };
  });
}

/* ---- Ajout rapide d'une dépense variable (depuis la pop-up Détails) ---- */
function openQuickExpenseModal(monthId, backCategoryId){
  var month = getMonth(monthId);
  var variableCharges = month.charges.filter(function(c){ return c.type === 'variable'; });

  var options = variableCharges.map(function(c){
    var cat = state.categories.find(function(x){ return x.id === c.categoryId; });
    return '<option value="'+c.id+'">'+escapeHtml(c.nom)+(cat?' ('+escapeHtml(cat.nom)+')':'')+'</option>';
  }).join('');

  openModalShell(
    '<h3>Ajouter une dépense</h3>'+
    '<div class="field"><label>Charge concernée</label><select id="f-charge">'+options+'</select></div>'+
    '<div class="field"><label>Date</label><input type="date" id="f-date" value="'+todayISO()+'"></div>'+
    '<div class="field"><label>Libellé (optionnel)</label><input type="text" id="f-label" placeholder="Ex : Courses Leclerc"></div>'+
    '<div class="field"><label>Montant (€)</label><input type="number" step="0.01" id="f-montant" placeholder="0.00"></div>'+
    '<div class="modal-foot">'+
      '<button class="secondary" id="f-cancel">Annuler</button>'+
      '<button id="f-save">Ajouter la dépense</button>'+
    '</div>'
  );
  document.getElementById('f-cancel').onclick = function(){ openVariableExpensesModal(monthId, backCategoryId); };
  document.getElementById('f-save').onclick = function(){
    var montant = parseFloat(document.getElementById('f-montant').value);
    var chargeId = document.getElementById('f-charge').value;
    if(!montant || montant <= 0){ showToast('Indique un montant valide.', true); return; }
    if(!chargeId){ showToast('Choisis une charge.', true); return; }
    month.expenses.push({
      id: uid('exp'),
      chargeId: chargeId,
      date: document.getElementById('f-date').value || todayISO(),
      label: document.getElementById('f-label').value.trim(),
      montant: montant
    });
    saveState(); render();
    showToast('Dépense ajoutée : -'+fmtEUR(montant));
    openVariableExpensesModal(monthId, backCategoryId);
  };
}

/* ---- Modifier / supprimer une dépense (depuis la pop-up Détails) ---- */
function openEditExpenseModal(monthId, expenseId, backCategoryId){
  var month = getMonth(monthId);
  var e = month.expenses.find(function(x){ return x.id === expenseId; });
  if(!e) return;
  var charge = month.charges.find(function(c){ return c.id === e.chargeId; });

  openModalShell(
    '<h3>Modifier la dépense</h3>'+
    '<p class="muted">Charge : '+escapeHtml(charge?charge.nom:'(supprimée)')+'</p>'+
    '<div class="field"><label>Date</label><input type="date" id="f-date" value="'+escapeHtml(e.date||todayISO())+'"></div>'+
    '<div class="field"><label>Libellé (optionnel)</label><input type="text" id="f-label" value="'+escapeHtml(e.label||'')+'"></div>'+
    '<div class="field"><label>Montant (€)</label><input type="number" step="0.01" id="f-montant" value="'+e.montant+'"></div>'+
    '<div class="modal-foot">'+
      '<button class="danger" id="f-del" style="margin-right:auto;">Supprimer</button>'+
      '<button class="secondary" id="f-cancel">Annuler</button>'+
      '<button id="f-save">Enregistrer</button>'+
    '</div>'
  );
  document.getElementById('f-cancel').onclick = function(){ openVariableExpensesModal(monthId, backCategoryId); };
  document.getElementById('f-save').onclick = function(){
    var montant = parseFloat(document.getElementById('f-montant').value);
    if(!montant || montant <= 0){ showToast('Indique un montant valide.', true); return; }
    e.date = document.getElementById('f-date').value || todayISO();
    e.label = document.getElementById('f-label').value.trim();
    e.montant = montant;
    saveState(); render();
    showToast('Dépense modifiée.');
    openVariableExpensesModal(monthId, backCategoryId);
  };
  document.getElementById('f-del').onclick = function(){
    openConfirm('Supprimer cette dépense ?', 'Le montant sera de nouveau disponible dans l\'enveloppe prévue.', function(){
      month.expenses = month.expenses.filter(function(x){ return x.id !== expenseId; });
      saveState();
      render();
      openVariableExpensesModal(monthId, backCategoryId);
    });
  };
}

/* ---------------- Modales génériques ---------------- */
function openModalShell(innerHtml, large){
  closeModal();
  var overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'modal-overlay';
  overlay.innerHTML = '<div class="modal-box'+(large?' modal-box-large':'')+'">'+innerHtml+'</div>';
  overlay.addEventListener('mousedown', function(e){ if(e.target === overlay) closeModal(); });
  document.body.appendChild(overlay);
}
function closeModal(){
  var o = document.getElementById('modal-overlay');
  if(o) o.remove();
}

    '<h3>'+escapeHtml(title)+'</h3>'+
    '<p class="muted">'+escapeHtml(msg)+'</p>'+

}

/* ---------------- Réordonnancement (catégories et charges) ---------------- */
function moveCategory(id, direction){
  var idx = state.categories.findIndex(function(c){ return c.id === id; });
  if(idx === -1) return;
  var newIdx = idx + direction;
  if(newIdx < 0 || newIdx >= state.categories.length) return;
  var tmp = state.categories[idx];
  state.categories[idx] = state.categories[newIdx];
  state.categories[newIdx] = tmp;
  saveState(); render();
}
function moveCharge(monthId, chargeId, direction){
  var month = getMonth(monthId);
  var ch = month.charges.find(function(c){ return c.id === chargeId; });
  if(!ch) return;
  // indices (dans le tableau complet) des charges de la même catégorie, dans l'ordre d'affichage
  var sameCategoryIdx = [];
  month.charges.forEach(function(c, i){ if(c.categoryId === ch.categoryId) sameCategoryIdx.push(i); });
  var posInCat = sameCategoryIdx.indexOf(month.charges.indexOf(ch));
  var swapWithPos = posInCat + direction;
  if(swapWithPos < 0 || swapWithPos >= sameCategoryIdx.length) return;
  var idxA = sameCategoryIdx[posInCat];
  var idxB = sameCategoryIdx[swapWithPos];
  var tmp = month.charges[idxA];
  month.charges[idxA] = month.charges[idxB];
  month.charges[idxB] = tmp;
  saveState(); render();
}

/* ---------------- Nouveau mois ---------------- */
function createNewMonth(){
  var ids = sortedMonthIds();
  var lastId = ids[ids.length-1];
  var newId = nextMonthId(lastId);
  if(state.months[newId]) return;
  var lastMonth = state.months[lastId];

  var newRecettes = lastMonth.recettes.map(function(r){ return { id: uid('rec'), nom: r.nom, montant: r.montant }; });
  var newCharges = lastMonth.charges.map(function(c){ return { id: uid('ch'), categoryId: c.categoryId, nom: c.nom, prevu: c.prevu, type: c.type }; });

  state.months[newId] = {
    id: newId, label: monthLabel(newId),
    recettes: newRecettes, charges: newCharges, expenses: []
  };
  state.currentMonthId = newId;
  saveState();
  showToast('Nouveau mois créé : '+monthLabel(newId));
}

/* ---------------- Impression ---------------- */
function printMonth(monthId){
  var month = getMonth(monthId);
  var t = monthTotals(monthId);
  var check = function(isChecked){ return isChecked ? '☑' : '☐'; };

  var html = '<h1>Budget — '+escapeHtml(month.label)+'</h1>';

  html += '<div class="print-col">';
  html += '<h2>Recettes</h2><table><tbody>';
  month.recettes.forEach(function(r){
    html += '<tr><td class="pchk">'+check(r.paid)+'</td><td>'+escapeHtml(r.nom)+'</td><td class="pamt">'+fmtEUR(r.montant)+'</td></tr>';
  });
  html += '<tr class="ptotal"><td></td><th>Total recettes</th><th class="pamt">'+fmtEUR(t.totalRecettes)+'</th></tr>';
  html += '</tbody></table>';
  html += '</div>';

  html += '<div class="print-columns">';
  state.categories.forEach(function(cat){
    var bucket = t.byCat[cat.id];
    if(bucket.items.length === 0) return;
    html += '<div class="print-col"><h2>'+escapeHtml(cat.nom)+'</h2><table><tbody>';
    bucket.items.forEach(function(it){
      var extra = it.charge.type === 'variable' ? ' (dép. '+fmtEUR(it.reel)+', reste '+fmtEUR(it.reste)+')' : '';
      var chk = it.charge.type === 'variable' ? '' : check(it.charge.paid);
      html += '<tr><td class="pchk">'+chk+'</td><td>'+escapeHtml(it.charge.nom)+extra+'</td><td class="pamt">'+fmtEUR(it.prevu)+'</td></tr>';
    });
    html += '<tr class="ptotal"><td></td><th>Sous-total</th><th class="pamt">'+fmtEUR(bucket.sousTotal)+'</th></tr>';
    html += '</tbody></table></div>';
  });
  html += '</div>';

  html += '<div class="print-col" style="max-width:320px;"><table><tbody>';
  html += '<tr class="ptotal"><th>Total dépenses</th><th class="pamt">'+fmtEUR(t.totalCharges)+'</th></tr>';
  html += '<tr class="ptotal"><th>Solde du mois</th><th class="pamt">'+fmtEUR(t.solde)+'</th></tr>';
  html += '</tbody></table></div>';

  document.getElementById('print-area').innerHTML = html;
  window.print();
}

/* ---- Impression du détail des dépenses variables d'une catégorie ---- */
function printVariableExpenses(monthId, categoryId){
  var month = getMonth(monthId);
  var chargeIdsInCat = categoryId ? month.charges.filter(function(c){ return c.categoryId === categoryId; }).map(function(c){ return c.id; }) : null;
  var list = month.expenses.slice()
    .filter(function(e){ return !chargeIdsInCat || chargeIdsInCat.indexOf(e.chargeId) !== -1; })
    .sort(function(a,b){ return (a.date||'').localeCompare(b.date||''); });
  var total = list.reduce(function(s,e){ return s + (Number(e.montant)||0); }, 0);
  var cat = categoryId ? state.categories.find(function(c){ return c.id === categoryId; }) : null;
  var check = function(isChecked){ return isChecked ? '☑' : '☐'; };

    });

    var tag = document.getElementById('print-orientation-override');

    window.removeEventListener('afterprint', cleanup);
  };
  window.addEventListener('afterprint', cleanup);
}

/* ---------------- Export / Import ---------------- */
function exportData(){
  var blob = new Blob([JSON.stringify(state, null, 1)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'budget-'+todayISO()+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  showToast('Export terminé.');
}
function importData(file){
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(e){
    try{
      var data = JSON.parse(e.target.result);
      if(!data.categories || !data.months){ throw new Error('format invalide'); }
      openConfirm('Remplacer toutes les données ?', 'Les données actuelles seront écrasées par celles du fichier importé.', function(){
        state = data;
        saveState();
        render();
        showToast('Données importées.');
      });
    }catch(err){
      showToast('Fichier invalide.', true);
    }
  };
  reader.readAsText(file);
}

/* ---------------- Initialisation ---------------- */
function init(){
  loadState();
  render();
}

document.addEventListener('DOMContentLoaded', init);

</script>
</body>
